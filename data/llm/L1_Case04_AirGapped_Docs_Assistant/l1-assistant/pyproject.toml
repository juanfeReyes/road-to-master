[project]
name = "l1-assistant"
version = "0.1.0"
description = "Offline Markdown RAG assistant"
readme = "README.md"
authors = [
    { name = "juanfeReyes", email = "juan.felipe.reyesg@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=0.2.0",
    "langchain-text-splitters>=0.3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
l1-assistant = "l1_assistant:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
