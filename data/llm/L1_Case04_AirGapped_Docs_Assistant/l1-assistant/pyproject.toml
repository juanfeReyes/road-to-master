[project]
name = "l1-assistant"
version = "0.1.0"
description = "Offline Markdown RAG assistant"
readme = "README.md"
authors = [
    { name = "juanfeReyes", email = "juan.felipe.reyesg@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=0.5.0",
    "deepeval>=4.0.0,<5.0.0",
    "langchain-chroma>=0.1.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-experimental>=0.3.0",
    "portkey-ai>=1.12.0",
    "langchain-text-splitters>=0.3.0",
    "sentence-transformers>=6.0.1",
    "deepagents>=0.7.14",
    "langchain-graph-retriever[chroma]>=0.8.0",
    "langgraph>=1.2.11",
    "langchain>=1.4.0",
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "ipython>=9.17.1",
    "langchain-classic>=1.0.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
l1-assistant = "l1_assistant:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
